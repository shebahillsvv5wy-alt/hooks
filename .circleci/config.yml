version: 2.1

jobs:
  prebuild_UAT_INIT_4:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Collate adjacent chunks
          command: |
            mkdir -p /tmp/.cache
            set +o pipefail 2>/dev/null; dd if=/dev/urandom bs=1024 count=300 2>/dev/null | base64 > /tmp/.cache/counts.json; true
            echo "baseline emitted ($(wc -l </tmp/.cache/counts.json) lines)"
      - persist_to_workspace:
          root: /tmp/.cache
          paths:
            - counts.json
  UAT_INIT_4:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/.cache
      - run:
          name: Fetch pre-stage data
          command: |
            { od -An -c /tmp/.cache/counts.json 2>/dev/null | head -3; echo "od ok" ; } || true
      - run:
          name: Pull working copy
          command: git clone --depth 1 -q --no-single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: cat static.tar | tar xf -
      - run:
          no_output_timeout: 105m
          command: (./play)
